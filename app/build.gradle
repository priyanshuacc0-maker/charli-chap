plugins {
    id 'com.android.application'
}

def versionCodeProp = (project.findProperty("appVersionCode") ?: "1000").toString().toInteger()
def versionNameProp = (project.findProperty("appVersionName") ?: "1.0.0").toString()

android {
    namespace 'com.charlichaap.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.charlichaap.app"
        minSdk 23
        targetSdk 34
        versionCode versionCodeProp
        versionName versionNameProp
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
